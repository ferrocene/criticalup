[package]
name = "criticaltrust"
version = "0.4.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Digital signatures implementation for CriticalUp"

[dependencies]
aws-config = { version = "1.8.18", optional = true, features = ["rustls", "behavior-version-latest"] }
aws-sdk-kms = { version = "1.111.0", optional = true, features = ["rustls"] }
aws-smithy-runtime-api = { version = "1.13.0", optional = true }
base64 = "0.22.1"
elliptic-curve = { version = "0.14", features = ["pkcs8"]  }
once_cell = "1.21.4"
p256 = { version = "0.14", features = ["ecdsa-core"]  }
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
serde_with.workspace = true
sha2.workspace = true
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, optional = true }
reqwest.workspace = true
hex = { version = "0.4.3", features = ["serde"] }
md-5.workspace = true

[dev-dependencies]
itertools = "0.14.0"
tokio.workspace = true
insta.workspace = true

[features]
aws-kms = ["aws-sdk-kms", "aws-config", "aws-smithy-runtime-api", "tokio"]
hash-revocation = []

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
