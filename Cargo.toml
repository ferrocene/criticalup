[workspace]
resolver = "2"
members = [ "crates/*"]
exclude = ["docs/.linkchecker/src/tools/linkchecker"]

[workspace.dependencies]
dirs = { version = "6.0.0", default-features = false }
futures = "0.3"
md-5 = "0.10.6"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
reqwest-middleware = "0.5"
reqwest-retry = "0.9.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_with = { version = "3.21.0", features = ["base64"]}
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3"
thiserror = "2.0.18"
time = { version = "0.3.53", features = ["std", "serde", "serde-well-known", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "process", "tracing"] }
toml_edit = { version = "0.22.27", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
  "ansi",
  "env-filter",
  "json",
] }
tracing-tree = "0.2"
walkdir = "2"
xz2 = { version = "0.1.7",  features = ["static"] }
hyper = { version = "1", features = ["tracing"] }
axum = { version = "0.8.9", features = ["default", "macros"] } # Use the same version as the server
axum-extra = { version = "0.10.3", features = ["typed-header"] }
http-body-util = "0.1"
insta = { version = "1.48.0", features = ["json"] }

[profile.release]
lto = "thin"
strip = "debuginfo"
